<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let actualNumber = (Math.random()) * 100;
        actualNumber = Math.round(actualNumber);
        document.writeln(actualNumber);
        let count = 0;
        for (let i = 1; i <= 100; i++) {
            count++;
            let num = prompt("Guess Number");
            if (num == actualNumber) {
                document.writeln("<br>You Win");
                break;
            }
            else if (num < actualNumber) {
                alert("The Actual Number is bigger than given Number");
            }
            else {
                alert("The Actual Number is smaller than given Number");
            }
        }
        document.writeln("<br>Your Score is " + (100 - count));
    </script>
</body>

</html>
