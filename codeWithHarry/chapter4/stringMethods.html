<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let name = "Mahbub Rahamn";
        document.writeln(name.toUpperCase());
        document.writeln(name.slice(2, 4));
        document.writeln(name.replace("Rahamn", "Sheikh"));
        document.writeln(name.concat("<br> is wrong name"));
        let str = "Md Mahbubur Rahman Sheikh";
        for (let i = 0; i < str.length; i++) {
            document.writeln("<br> " + str[i]);
        }
    </script>
</body>
