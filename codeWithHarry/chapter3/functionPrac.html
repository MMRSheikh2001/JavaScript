<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        function onePlusTwo(x, y) {
            return x + y;
        }
        let div = (x, y) => {
            return x / y;
        }
        document.writeln(onePlusTwo(2, 43));
        document.writeln(div(45, 2));
        let hello = () => {
            document.writeln("\nHello")
        }
        hello();
    </script>
</body>

</html>
