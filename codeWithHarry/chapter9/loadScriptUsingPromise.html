<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let p1 = new Promise((resolve, reject) => {
            setTimeout(() => {
                console.log("I am promise after 4 seconds");
                resolve(56);
            }, 4000)
        })
        p1.then((value) => {
            console.log(value);
            let p2 = new Promise((resolve, reject) => {
                setTimeout(() => {
                    console.log("I am promise after 4 seconds");
                    resolve(56);
                }, 4000)
            })
            return p2;
        }).then((value) => {
            console.log("done")
        })
    </script>
</body>

</html>
