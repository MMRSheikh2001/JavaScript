<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let delay = (ms) => {
            return new Promise((resolve, reject) => {
                setTimeout(resolve, ms)
            })
        }
        let showMessage = async () => {
            console.log("Searching for network");

            await delay(3000);
            console.log("Found Network");
            await delay(3000);
            console.log("Preaparing to crack password");
            await delay(3000);
            console.log("Password Cracking");
            await delay(3000);
            console.log("Password Cracked");
            await delay(3000);
            console.log("welcome");
        }
        showMessage();

    </script>
</body>

</html>
